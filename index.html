<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eink Frame</title>
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="css/main.css?v=20250731">
</head>

<body>
    <div class="main">
        <h3>Eink Frame</h3>
        <fieldset>
            <legend>藍牙連接</legend>
            <div class="flex-container">
                <div class="flex-group">
                    <button id="connectbutton" type="button" class="primary" onclick="preConnect()">連接</button>
                    <button id="reconnectbutton" type="button" class="secondary" onclick="reConnect()">重連</button>
					<button type="button" class="secondary" onclick="clearLog()">清空日誌</button>
                </div>
				<div class="flex-group right debug">
					<label for="epddriver">驅動</label>
					<select id="epddriver">
						<option value="02" data-color="blackWhiteColor" data-size="2.13_250_128">SSD1680 2.13" (黑白)</option>
						<option value="01" data-color="threeColor" data-size="4.2_400_300">SSD1619 4.2" (三色)</option>
					</select>
				</div>
				<div class="flex-group debug">
					<label for="epdpins">引腳</label>
					<input id="epdpins" type="text" value="">
					<button id="setDriverbutton" type="button" class="primary" onclick="setDriver()">確認</button>
				</div>
            </div>
			<div id="log"></div>
        </fieldset>
		<fieldset>
            <legend>設備控制</legend>
            <div class="flex-container">
				<div class="flex-group">
					<button id="clearscreenbutton" type="button" class="secondary" onclick="clearScreen()">清除屏幕</button>
                </div>
                <div class="flex-group right debug">
                    <input type="text" id="cmdTXT" value="">
                    <button id="sendcmdbutton" type="button" class="primary" onclick="sendcmd()">發送命令</button>
                </div>
			</div>
		</fieldset>
		<fieldset>
        	<legend>藍牙傳圖</legend>
			<div class="flex-container">
				<input type="file" id="imageFile" accept=".png,.jpg,.bmp,.webp,.jpeg">
			</div>
			<div class="flex-container options">
				<div class="flex-group debug">
					<label for="canvasSize">畫布尺寸:</label>
					<select id="canvasSize">
						<option value="2.13_250_128">2.13" (250x128)</option>
						<option value="4.2_400_300" selected>4.2" (400x300)</option>
					</select>
				</div>
				<div class="flex-group debug">
					<label for="ditherMode">顏色模式:</label>
					<select id="ditherMode">
						<option value="blackWhiteColor">雙色(黑白)</option>
						<option value="threeColor">三色(黑白紅)</option>
					</select>
				</div>
				<div class="flex-group">
					<label for="ditherAlg">抖動算法:</label>
					<select id="ditherAlg">
						<option value="floydSteinberg">Floyd-Steinberg</option>
						<option value="atkinson">Atkinson</option>
						<option value="bayer">Bayer</option>
						<option value="stucki">Stucki</option>
						<option value="jarvis">Jarvis-Judice-Ninke</option>
					</select>
				</div>
				<div class="flex-group">
					<label for="ditherStrength">抖動強度:</label>
					<input type="range" min="0" max="5" step="0.1" value="1.0" id="ditherStrength">
					<label id="ditherStrengthValue">1.0</label>
				</div>
				<div class="flex-group">
					<label for="ditherContrast">對比度:</label>
					<input type="range" min="0.5" max="2" step="0.1" value="1.2" id="ditherContrast">
					<label id="ditherContrastValue">1.2</label>
				</div>
			</div>
			<div class="flex-container options">
				<div class="flex-group debug">
					<label for="mtusize">MTU:</label>
					<input type="number" id="mtusize" value="20" min="0" max="255">
					<label for="interleavedcount">確認間隔:</label>
					<input type="number" id="interleavedcount" value="50" min="0" max="500">
				</div>
			</div>
			<div class="status-bar"><b>狀態：</b><span id="status"></span></div>
			<div class="flex-container">
				<div class="flex-group">
					<button type="button" class="secondary debug" onclick="rotateCanvas()">旋轉畫布</button>
					<button type="button" class="secondary" onclick="clearCanvas()">清除畫布</button>
					<button type="button" class="secondary debug" onclick="downloadDataArray()">下載數組</button>
					<button id="sendimgbutton" type="button" class="primary" onclick="sendimg()">發送圖片</button>
				</div>
			</div>
			<div class="canvas-container">
				<div class="canvas-title"></div>
				<canvas id="canvas" width="400" height="300"></canvas>
				<div class="flex-container canvas-tools">
					<div class="flex-group tool-buttons">
						<button id="brush-mode" title="畫筆" class="tool-button">✏️</button>
						<button id="eraser-mode" title="橡皮擦" class="tool-button">🧽</button>
						<button id="text-mode" title="添加文字" class="tool-button">T</button>
					</div>
					<div class="flex-group brush-tools">
						<label for="brush-color">顏色:</label>
						<select id="brush-color">
                            <option value="#000000">黑色</option>
                            <option value="#FF0000">紅色</option>
                            <option value="#FFFF00">黃色</option>
							<option value="#00FF00">綠色</option>
							<option value="#0000FF">藍色</option>
                            <option value="#FFFFFF">白色</option>
                        </select>
						<label for="brush-size">粗細:</label>
						<input type="number" id="brush-size" value="2" min="1" max="100">
					</div>
				</div>
				<div class="flex-container canvas-tools">
					<div class="flex-group text-tools">
						<label for="font-family">字體:</label>
						<select id="font-family">
								<option value="Arial">Arial</option>
								<option value="sans-serif">Sans-serif</option>
								<option value="monospace">Monospace</option>
								<option value="SimSun">宋體</option>
								<option value="SimHei">黑體</option>
								<option value="Microsoft Yahei">微軟雅黑</option>
								<option value="Microsoft JhengHei">微軟正黑體</option>
								<option value="KaiTi">楷體</option>
								<option value="NSimSun">新宋體</option>
								<option value="FangSong">仿宋</option>
								<option value="YouYuan">幼圓</option>
								<option value="LiSu">隸書</option>
								<option value="STHeiti">華文黑體</option>
								<option value="STXihei">華文細黑</option>
								<option value="STKaiti">華文楷體</option>
								<option value="STSong">華文宋體</option>
								<option value="STFangsong">華文仿宋</option>
								<option value="STZhongsong">華文中宋</option>
								<option value="STHupo">華文琥珀</option>
								<option value="STXinwei">華文新魏</option>
								<option value="STLiti">華文隸書</option>
								<option value="STXingkai">華文行楷</option>
								<option value="FZShuTi">方正舒體</option>
								<option value="FZYaoti">方正姚體</option>
								<option value="PingFang SC">蘋方</option>
								<option value="Source Han Sans CN">思源黑體</option>
								<option value="Source Han Serif SC">思源宋體</option>
								<option value="WenQuanYi Micro Hei">文泉驛微米黑</option>
							</optgroup>
						</select>
						<label for="font-size">大小:</label>
						<input type="number" id="font-size" value="16" min="1" max="100">
					</div>
					<div class="flex-group text-tools">
						<input type="text" id="text-input" placeholder="輸入文字" style="width:150px">
						<button id="text-bold" title="粗體">B</button>
						<button id="text-italic" title="斜體">I</button>
						<button id="add-text-btn" class="primary">添加文字</button>
					</div>
					<div class="flex-group crop-tools">
						<button id="crop-zoom-in" title="放大" class="secondary">+</button>
						<button id="crop-zoom-out" title="縮小" class="secondary">-</button>
						<button id="crop-move-left" title="左移">⇦</button>
						<button id="crop-move-up" title="上移">⇧</button>
						<button id="crop-move-down" title="下移">⇩</button>
						<button id="crop-move-right" title="右移">⇨</button>
						<button class="primary" onclick="finishCrop()">完成</button>
					</div>
				</div>
			</div>
        </fieldset>
		<div class="footer">
			<span class="copy">&copy; 2025 tsl0922.</span>
			<span class="links">
				<a href="https://github.com/tsl0922/EPD-nRF5">Github</a>
				<a href="https://qm.qq.com/q/SckzhfDxuu" onclick="return confirm('本羣是此開源固件作者的技術交流羣\n如果你購買了成品，請找賣家提供售後！')">交流羣</a>
				<a href="?debug=true" id="debug-toggle">開發模式</a>
			</span>
		</div>
    </div>
    <script type="text/javascript" src="js/dithering.js?v=20250731"></script>
    <script type="text/javascript" src="js/paint.js?v=20250731"></script>
    <script type="text/javascript" src="js/crop.js?v=20250731"></script>
    <script type="text/javascript" src="js/main.js?v=20250731"></script>
</body>

</html>
